<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>弹壳公会远征统计</title>
<style>
  body { font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; text-align: center; margin-top: 80px; color: #333; padding: 0 16px; }
  a { color: #b8860b; word-break: break-all; }
  #list { margin-top: 24px; font-size: 15px; line-height: 2; }
</style>
</head>
<body>
<a id="enter-ocr" href="http://chenyl.free.idcfengye.com/tidal/" style="position:fixed;top:14px;right:16px;z-index:9;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid #e3cd94;color:#b8860b;font-size:13.5px;font-weight:700;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.08)">潮汐秘境计算器</a>
<p id="tip">正在连接服务器，请稍候...</p>
<p style="font-size:13px;color:#888;margin-top:10px;line-height:2;">
  服务器没响应时用静态版（无需服务器）：<br>
  <a href="/tidal/">chenyl031103.github.io/tidal/</a>
  <span style="margin:0 6px">·</span>
  <a href="https://www.axxiu.cn/project/t1gBdI7v/">www.axxiu.cn/project/t1gBdI7v/</a>
</p>
<div id="list" style="display:none;">
  <p>如果 5 秒内没有自动跳转，请点下面任意一个地址：</p>
  <div id="links"></div>
</div>
<script>
// 同时探测所有 HTTPS 入口，谁先连上就跳谁；全部失败则用主入口 HTTP 兜底。
// 探测必须用「真图片」而不是 fetch(no-cors)：隧道域名过期后（例如 cpolar 到期）仍会返回 200 的
// 404 页面，no-cors 拿不到状态码分不出来，访客会被直接跳到隧道商的报错页上。
var CANDIDATES = [
  "https://korea-flood-grade-bargains.trycloudflare.com"
];
var FALLBACK = "http://chenyl.free.idcfengye.com";
var PROBE_IMG = "/contact_qr.jpg";     // 只有这个路径返回真图片，才算入口活着
var jumped = false;

function go(url) {
  if (jumped) return;
  jumped = true;
  location.replace(url);
}

function probe(url) {
  return new Promise(function (resolve) {
    var done = false, timer = null;
    function finish(v) { if (done) return; done = true; if (timer) clearTimeout(timer); resolve(v); }
    timer = setTimeout(function () { finish(null); }, 3000);
    var img = new Image();
    img.onload = function () { finish(url); };
    img.onerror = function () { finish(null); };
    img.src = url + PROBE_IMG + "?_=" + Date.now();
  });
}

(function () {
  var links = document.getElementById("links");
  CANDIDATES.concat([FALLBACK]).forEach(function (u) {
    var a = document.createElement("a");
    a.href = u; a.textContent = u; a.style.display = "block";
    links.appendChild(a);
  });
  setTimeout(function () { document.getElementById("list").style.display = "block"; }, 5000);
  setTimeout(function () { go(FALLBACK); }, 8000);

  Promise.all(CANDIDATES.map(probe)).then(function (results) {
    var alive = results.filter(Boolean);
    if (alive.length > 0) { go(alive[0]); }
    // 都探测失败时，交给上面的 8 秒兜底跳转到主入口
  });
})();
</script>
</body>
</html>
