<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>《弹壳特攻队》-潮汐秘境计算器</title>
<meta name="description" content="《弹壳特攻队》潮汐秘境计算器：把当前棋盘的数字、钻石、× 标记填进来，自动推出哪些格子必定是钻石、哪些必定不是钻石、下一步先点哪里。支持上传截图自动识别。">
<meta name="theme-color" content="#0f1923">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='25'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?vmvmv7gcqbs">
<script>var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);/* 默认深色（护眼），右上角可切换 */</script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="ico-gem" viewBox="0 0 24 24">
      <path d="M6.6 3.2h10.8L21.4 9 12 21.2 2.6 9z" fill="currentColor"/>
      <path d="M6.6 3.2 8.6 9h6.8l2-5.8z" fill="#5a3d05" fill-opacity=".28"/>
      <path d="M8.6 9 12 21.2 15.4 9z" fill="#ffffff" fill-opacity=".3"/>
    </symbol>
    <symbol id="ico-x" viewBox="0 0 24 24">
      <path d="M5.8 5.8 18.2 18.2M18.2 5.8 5.8 18.2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-check" viewBox="0 0 24 24">
      <path d="M4.5 12.8l4.8 4.8L19.6 7.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ico-warn" viewBox="0 0 24 24">
      <path d="M12 3.4 22 20.4H2z" fill="currentColor"/>
      <path d="M12 9.4v5" stroke="#0f1923" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="12" cy="17.4" r="1.2" fill="#0f1923"/>
    </symbol>
    <symbol id="ico-aim" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
      <path d="M12 1.4v4M12 18.6v4M1.4 12h4M18.6 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-image" viewBox="0 0 24 24">
      <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="8.6" cy="10" r="1.9" fill="currentColor"/>
      <path d="M3.4 17.4l4.8-5 3.4 3.6 3.2-3 5.8 4.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">💎</span>
    <span class="brand-text">
      <strong data-i18n="brand.name">潮汐秘境计算器</strong>
      <small data-i18n="brand.tag">填好残局 → 棋盘上直接标出哪格是钻石、哪格可以标 ×</small>
    </span>
  </div>
  <nav class="topbar-nav">
    <button class="ghost-btn" id="btn-shot-open" type="button">
      <svg class="ico"><use href="#ico-image"/></svg><span data-i18n="nav.ocr">截图识别</span>
    </button>
    <button class="ghost-btn" id="btn-help" type="button" data-i18n="nav.help">使用说明</button>
    <button class="ghost-btn" id="btn-sample" type="button" title="随便玩玩：潮汐秘境 / 扫雷" data-i18n="nav.game" data-i18n-title="nav.game.tip">游戏模式</button>
    <button class="ghost-btn sm" id="btn-lang-zh" type="button" title="中文">中文</button>
    <button class="ghost-btn sm" id="btn-lang-en" type="button" title="English">EN</button>
    <button class="ghost-btn" id="theme-toggle" type="button" title="切换深色/浅色">🌙</button>
  </nav>
</header>

<main>
  <section class="stage" id="stage">


    <div class="map-bar">
      <div class="seg seg-sm" id="size-seg" role="tablist" aria-label="地图尺寸">
        <button class="seg-btn is-on" data-size="8" type="button">8×8</button>
        <button class="seg-btn" data-size="10" type="button">10×10</button>
        <button class="seg-btn" data-size="12" type="button">12×12</button>
      </div>
      <span class="map-chip map-chip-quiet map-chip-gem" id="chip-gem-progress" title="还剩几颗没找到 / 本图总数（总数按档位固定：8×8=20、10×10=30、12×12=45）">
        <span data-i18n="chip.left">剩余宝石</span> <b id="gem-left">20</b>/<b id="gem-total-text">20</b>
      </span>
      <span class="map-chip map-chip-quiet" id="chip-cost" title="开出数字或钻石的格子算一票（× 和没翻开的不算）；1 票 = 1500 钻石">
        <b id="tickets-used">0</b> <span data-i18n="chip.ticketsUnit">票</span> · <b id="diamonds-used">0</b> <span data-i18n="chip.costUnit">钻石</span>
      </span>
      <span class="map-chip map-chip-quiet" id="chip-per-gem" title="用票数 ÷ 已找到的宝石数 —— 平均每颗宝石花了多少票，越小越划算">
        <span data-i18n="chip.perGem">平均</span> <b id="per-gem">—</b> <span data-i18n="chip.perGemUnit">票/宝石</span>
      </span>
    </div>


    <div class="game-banner" id="game-banner" hidden>
      <span class="gb-name" id="game-banner-name"></span>
      <span class="gb-sub" id="game-banner-sub"></span>
    </div>

    <div class="board-shell" id="board-shell">
      <div class="board-scroll" id="board-scroll">
        <div class="board" id="board" role="grid" aria-label="残局棋盘"></div>
      </div>
      <span class="board-tools" id="board-tools" title="调格子大小（自动按屏幕适配）" data-i18n-title="tools.tip">
        <button class="bb-btn" id="cell-minus" type="button" title="格子改小">−</button>
        <button class="bb-btn" id="cell-plus" type="button" title="格子改大">＋</button>
        <button class="bb-btn bb-auto" id="cell-auto" type="button" title="恢复自动适配屏幕" data-i18n="tools.auto" data-i18n-title="tools.auto.tip">自动</button>
        <button class="bb-btn" id="board-fs" type="button" title="整个工具区全屏（手机上格子更大好点）" data-i18n="tools.fs" data-i18n-title="tools.fs.tip">全屏</button>
      </span>
    </div>

    <div class="palette" id="palette">
      <span class="palette-label" data-i18n="palette.label">单击涂</span>
      <button class="brush is-on brush-select" data-brush="select" type="button" title="单击格子只是选中它（不改内容）" data-i18n-title="palette.select.tip">
        <span data-i18n="palette.select">选中</span>
      </button>
      <button class="brush brush-x brush-icon" data-brush="X" type="button" title="点格子标上 / 取消 ×" data-i18n-title="palette.x.tip">
        <svg class="tileico brush-tile" aria-hidden="true"><use href="#uw-tile-x"/></svg>
      </button>
      <button class="brush" data-brush="hide" type="button" title="单击格子清除" data-i18n-title="palette.clear.tip">
        清除
      </button>
      <button class="brush brush-gem brush-icon" data-brush="G" type="button" title="标记钻石" data-i18n-title="palette.gem.tip">
        <svg class="tileico brush-tile" aria-hidden="true"><use href="#uw-gem"/></svg>
      </button>
      <span class="brush-group" id="brush-nums">
        <button class="brush brush-num" data-brush="0" type="button" title="已翻开的空白格">0</button>
        <button class="brush brush-num" data-brush="1" type="button">1</button>
        <button class="brush brush-num" data-brush="2" type="button">2</button>
        <button class="brush brush-num" data-brush="3" type="button">3</button>
        <button class="brush brush-num" data-brush="4" type="button">4</button>
        <button class="brush brush-num" data-brush="5" type="button">5</button>
        <button class="brush brush-num" data-brush="6" type="button">6</button>
        <button class="brush brush-num" data-brush="7" type="button">7</button>
        <button class="brush brush-num" data-brush="8" type="button">8</button>
      </span>
      <span class="palette-actions">
        <button class="brush brush-act" id="btn-undo" type="button" disabled title="撤销上一步改动（Ctrl+Z）" data-i18n-title="vb.undo.tip"><span data-i18n="vb.undo">撤销</span></button>
        <button class="brush brush-act is-danger" id="btn-clear" type="button" title="重置整个棋盘（会二次确认；可撤销）" data-i18n-title="vb.clear.tip"><span data-i18n="vb.clear">重置</span></button>
        <label class="rec-auto" title="录入一个格子后自动提示下一个推荐格（点 0 展开一片时可以关掉，逐个点选）" data-i18n-title="rec.auto.tip">
          <input type="checkbox" id="cb-auto-next" checked> <span data-i18n="rec.auto">自动提示</span>
        </label>
      </span>
      <span class="palette-tip" data-i18n="palette.tip">单击选中格子 → 键盘 0-8 填数字、Enter 钻石、X 标×、Delete 清除 · 双击也可选值 · 右键快速标钻石</span>
    </div>

    <div class="game-bar" id="game-bar" hidden>
      <span class="gb gb-title" id="gb-title"></span>
      <span class="gb gb-hint" id="gb-hint"></span>
      <span class="gb gb-strong" id="gb-left-wrap"><span data-i18n="gb.left">剩余</span> <b id="gb-left">0</b> <span data-i18n="gb.mines">颗雷</span></span>
      <span class="gb" id="gb-gem-wrap" hidden><span data-i18n="gb.found">已找到钻石</span> <b id="gb-found">0</b> / <b id="gb-total">45</b></span>
      <span class="gb" id="gb-open-wrap" hidden><span data-i18n="gb.opened">已翻开</span> <b id="gb-open">0</b> / <b id="gb-open-total">0</b> <span data-i18n="chip.cells">格</span></span>
      <span class="gb" id="gb-cost-wrap" hidden><span data-i18n="gb.tickets">用票</span> <b id="gb-tickets">0</b> · <span data-i18n="gb.spent">已用钻石</span> <b id="gb-spent">0</b> · <span data-i18n="gb.perGem">平均</span> <b id="gb-per-gem">—</b> <span data-i18n="gb.perGemUnit">票/宝石</span></span>
      <span class="gb gb-time" id="gb-time-wrap" hidden>⏱ <b id="gb-time">0:00</b></span>
      <span class="gb" id="gb-marks-wrap" hidden><span data-i18n="gb.marks">× 标记</span> <b id="gb-marks">0</b></span>
      <span class="gb gb-err" id="gb-wrong-wrap" hidden><span data-i18n="gb.wrong">其中标错</span> <b id="gb-wrong">0</b> <span data-i18n="gb.wrongUnit">个</span></span>
      <label class="gb gb-hint-switch" id="gb-hint-switch" hidden title="打开后：自动闪烁推荐格 + 每格显示含钻概率" data-i18n-title="gb.hintSwitch.tip">
        <input type="checkbox" id="cb-game-hint"> <span data-i18n="gb.hintSwitch">自动提示</span>
      </label>
      <span class="gb-actions">
        <button class="ghost-btn sm" id="btn-game-restart" type="button" data-i18n="gb.restart">重开一局</button>
        <button class="ghost-btn sm" id="btn-game-switch" type="button" data-i18n="gb.switch">换玩法</button>
        <button class="ghost-btn sm" id="btn-game-quit" type="button" data-i18n="gb.quit">退出游戏</button>
      </span>
    </div>

    <div class="status-bar">
      <p class="advice" id="advice">
        <span id="advice-text" data-i18n="advice.empty">先把残局填进来，或点右上角「随机玩一盘」体验一下。</span>
      </p>

      <div class="verdict-bar" id="verdict-bar">
        <span class="vb vb-gem"><i class="vb-sign vb-sign-gem">✓</i><span data-i18n="vb.gem">钻石</span> <b id="vb-gem">0</b></span>
        <span class="vb vb-safe"><i class="vb-sign vb-sign-safe">×</i><span data-i18n="vb.safe">不是钻石</span> <b id="vb-safe">0</b></span>
        <span class="vb vb-unknown"><span data-i18n="vb.unknown">待定</span> <b id="vb-unknown">0</b></span>
        <span class="vb vb-err" id="vb-err-wrap" hidden><svg class="ico"><use href="#ico-warn"/></svg><b id="vb-err"></b></span>
      <span class="vb-actions">
        <button class="ghost-btn" id="btn-clear-frames" type="button" hidden title="识别导入的格子核对完了：一键去掉金框/红框提示（格子内容不动）" data-i18n-title="vb.frames.tip"><svg class="ico"><use href="#ico-check"/></svg><span data-i18n="vb.frames">核对完成</span></button>
      </span>
      </div>
    </div>

    <p class="credit">《弹壳特攻队》<span data-i18n="credit.by">潮汐秘境计算器 · 海出品</span></p>
    <p class="credit-wx"><button class="wx-btn" id="btn-wx" type="button" title="点一下复制微信号">
      <span data-i18n="credit.wx">公众号</span>：<b>chenyl031103</b>
    </button></p>

    <div class="reveal-bar" id="reveal-bar" hidden>
      <div class="rb-head">
        <span class="rb-label"><span data-i18n="rb.opened">翻开的</span> <b id="rb-target">—</b> <span data-i18n="rb.is">是：</span></span>
        <button class="rb-close" data-rb="cancel" type="button" title="取消">✕</button>
      </div>
      <span class="rb-values" id="rb-values"></span>
      <span class="rb-hint" id="rb-hint"></span>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal-mask" data-close></div>
      <div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toasts" id="toasts"></div>

  </section>
</main>

<script>window.TIDAL_OCR = false;/* 有没有同源服务器识别：静态托管版由构建脚本改成 false */</script>
<script>window.TIDAL_OCR_MODE = 'local';/* 'local'（只本机识别）| 'server'（只服务器）| 'off'（关掉）；静态版构建时写成 local */</script>
<script>window.TIDAL_OCR_URL = 'http://chenyl.free.idcfengye.com/';/* 静态版构建时填入「带截图识别的网址」 */</script>
<script src="sweeper-icons.js?vmvmv7gcqbs"></script>
<script src="vision.js?vmvmv7gcqbs"></script>
<script src="solver-core.js?vmvmv7gcqbs"></script>
<script src="solver.js?vmvmv7gcqbs"></script>
</body>
</html>
